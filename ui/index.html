<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="style.css" />
		<script src="jquery.min.js"></script>
		<script>
			function reiniciar() {
				$('.fondoazul').hide();
				$('.valija').addClass('afuera');
				$('.valija').removeClass('centro');
				$('#home,#categoria').fadeOut();
				va();
			}
			function va() {
				const porFila = 4;
				const delayItem = 150; // si querés aún más rápido, bajalo a 120 o 100
				const overlap = 2;     // empieza en la 2 (antes era la 3)

				$('.valija').each(function (i) {
					const fila = Math.floor(i / porFila);
					const pos = i % porFila;

					const delay =
						(pos * delayItem) +
						(fila * delayItem * (porFila - overlap));

					setTimeout(() => {
						$(this).removeClass('afuera');
					}, delay);
				});
			}
			function limpiarCategoria() {
				$('.valija,.estante').removeClass('bloqueada');
			}
			function aplicarCategoria(categoria) {
				const configuracion = {
					oro: {
						estantes: [3, 4, 5, 6],
						valijasDesde: 9,
						valijasHasta: 24
					},
					plata: {
						estantes: [1, 2, 5, 6],
						valijas: [[1, 8], [17, 24]]
					},
					bronce: {
						estantes: [1, 2, 3, 4],
						valijasDesde: 1,
						valijasHasta: 16
					}
				};
				const filtro = configuracion[categoria];

				limpiarCategoria();

				if (!filtro) {
					return;
				}

				filtro.estantes.forEach(function(numero) {
					$('#est' + String(numero).padStart(2, '0')).addClass('bloqueada');
				});

				$('.valija').each(function() {
					const numero = parseInt(this.id.replace('val', ''), 10);
					let bloqueada = false;

					if (filtro.valijas) {
						bloqueada = filtro.valijas.some(function(rango) {
							return numero >= rango[0] && numero <= rango[1];
						});
					} else {
						bloqueada = numero >= filtro.valijasDesde && numero <= filtro.valijasHasta;
					}

					if (bloqueada) {
						$(this).addClass('bloqueada');
					}
				});
			}
			function cierrefinal() {
				home();
			}

			var introPaso = 0;
			var debugActivo = false;
			var debugTaps = 0;
			var debugTapTimer = null;

			function mostrarDebug(data) {
				if (!debugActivo) {
					return;
				}

				if (typeof data === 'string') {
					$('#debugserial').text(data);
					return;
				}

				const partes = [
					'DEBUG SERIAL',
					'indice=' + (data.indice ?? '-'),
					'puerto=' + (data.port ?? ('ser[' + (data.ser_index ?? '-') + ']')),
					'pos=' + (data.pos ?? '-'),
					'envio=' + (data.cmd_raw ?? data.cmd ?? '-')
				];

				if (data.response) {
					partes.push('respuesta=' + data.response);
				}

				if (data.error) {
					partes.push('error=' + data.error);
				}

				$('#debugserial').text(partes.join(' | '));
			}

			function activarDebugPorLogo() {
				debugTaps += 1;
				clearTimeout(debugTapTimer);
				debugTapTimer = setTimeout(function() {
					debugTaps = 0;
				}, 1600);

				if (debugTaps >= 5) {
					debugActivo = !debugActivo;
					debugTaps = 0;
					$('#debugserial').toggle(debugActivo);
					mostrarDebug(debugActivo ? 'DEBUG SERIAL | esperando seleccion...' : '');
				}
			}
			$().ready(function() {
				$('#logojuego').click(reiniciar);
				$('#home .logohome').click(activarDebugPorLogo);
				$('.valija').click(async function() {
					if ($(this).hasClass('bloqueada')) {
						return;
					}
					$('.fondoazul').fadeIn();
					$(this).addClass('centro');
					//const indice = $(this).attr('src').replace(/\D/g, '')
					const indice = $(this).attr('ind');						
					mostrarDebug({ indice: indice, cmd: 'enviando...' });
					if (window.pywebview && window.pywebview.api) {
						const result = await window.pywebview.api.enviar(indice);
						mostrarDebug(result);
						cierrefinal(result)
					} else {
						console.log("pywebview no disponible, simulo envío:", indice);
						mostrarDebug({ indice: indice, cmd: 'SIMULADO' });
						setTimeout(function() {
							cierrefinal("OK")
						},2500);
					}
				});
				$('#comenzar').click(function() {
					if (introPaso == 0) {
						introPaso = 1;
						$('#introimg').fadeOut(function() {
							$(this).attr('src', 'img/tienen.png').fadeIn();
						});
						$(this).text('SIGUIENTE');
						return;
					}
					$('#categoria').show();
					$('#home').fadeOut();
				});
				$('.categoria-boton').click(function() {
					aplicarCategoria($(this).data('categoria'));
					reiniciar();
				});
			});
			function home() {
				$('#home').fadeIn();
				introPaso = 0;
				$('#introimg').attr('src', 'img/tinedita.png').show();
				$('#comenzar').text('COMENZAR');
				$('#categoria').hide();
				limpiarCategoria();
			}
			function setup() {
				console.log("pywebview listo");

				document.addEventListener("keydown", function (e) {
					if (e.key === "Escape") {
						console.log("ESC presionado");
						window.pywebview.api.cerrar();
					}
				});
			}

			if (window.pywebview) {
				setup();
			} else {
				window.addEventListener('pywebviewready', setup);
			}
		</script>
	</head>
